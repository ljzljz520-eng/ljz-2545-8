<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>离线导览 · 千溪古桥徒步</title>
<link rel="icon" href="/assets/img/logo.svg">
<link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
<div class="banner">示例工程：桥梁、片区与维护日历均为虚构演示数据；本平台不提供任何真实桥梁承载/安全保证。</div>
<header class="site-header">
  <div class="container">
    <a class="brand" href="/index.html"><img src="/assets/img/logo.svg" alt="">千溪古桥徒步</a>
    <nav class="nav">
      <a href="/index.html" data-nav="home">首页</a>
      <a href="/bridges.html" data-nav="bridges">桥梁故事</a>
      <a href="/routes.html" data-nav="routes">路线规划</a>
      <a href="/offline.html" data-nav="offline">离线导览</a>
      <a href="/design.html" data-nav="design">设计说明</a>
    </nav>
  </div>
</header>
<main class="container">
<h1 style="margin:24px 0 6px">离线导览包</h1>
<p class="muted">带版本清单的分块下载。每块独立校验 SHA-256；缺块或坏块时整包不可用，旧版本回灌一律拒绝。</p>
<div class="grid cols-2">
  <section class="card">
    <h3>① 版本清单</h3>
    <div id="manifest" class="muted">读取中…</div>
  </section>
  <section class="card">
    <h3>② 下载 / 导入</h3>
    <div class="controls">
      <label>目标版本 <select id="version-select"></select></label>
      <label>模式
        <select id="mode-select"><option value="full">完整包</option><option value="delta">增量包</option></select>
      </label>
      <label>模拟已装版本 <select id="current-select"><option value="">（未安装）</option></select></label>
    </div>
    <div id="chunks-pick" class="muted"></div>
    <button class="btn" id="import-btn">评估导入并校验块</button>
    <div id="import-result"></div>
  </section>
</div>
<section class="card" style="margin-top:18px">
  <h3>③ 本地存储状态</h3>
  <pre id="store-state" class="muted" style="white-space:pre-wrap">尚未开始导入。</pre>
  <div class="btn-row">
    <button class="btn ghost small" id="rollback-btn">尝试旧包回灌（3.0.0 覆盖 4.0.0）</button>
    <button class="btn ghost small" id="clear-btn">清空本地状态</button>
  </div>
</section>
<script type="module" src="/assets/js/offline.js"></script>
</main>
<footer class="site-footer">
  <div class="container">
    <p>千溪古桥徒步 · 教学/演示项目。对象模型：桥梁本体 ≠ 入口 ≠ 通行段；状态精确到端、到段。</p>
    <p>宽度或坡度未测一律显示“无法确认”；不自动认证适合儿童或无障碍；不编造真实桥梁承载保证。</p>
  </div>
</footer>
<script src="/assets/js/common.js"></script>
<script>document.querySelector('[data-nav="offline"]').classList.add('active')</script>
</body></html>
